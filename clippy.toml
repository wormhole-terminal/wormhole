allow-unwrap-in-tests = true
allow-expect-in-tests = true
allowed-wildcard-imports = ["gpui_kit"]
disallowed-methods = [
  { path = "std::process::Command::new", reason = "build commands with wormhole_term::sys::process::command: one place spawns" },
  { path = "std::fs::write", reason = "write with wormhole_core::storage::files::write_atomic: atomic, link-safe, owner-only" },
  { path = "dirs::home_dir", reason = "ask wormhole_core::platform::paths::home: one place knows where home is" },
  { path = "dirs::data_dir", reason = "ask wormhole_core::platform::paths::data_base: one place knows where data goes" },
  { path = "std::env::temp_dir", reason = "ask wormhole_core::platform::paths::temp: one place knows the temporary folder" },
]
