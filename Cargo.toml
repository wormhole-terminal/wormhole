[workspace]
members = ["crates/*"]
default-members = ["crates/wormhole"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/wormhole-terminal/wormhole"
publish = false

[workspace.dependencies]
wormhole-core = { path = "crates/wormhole-core" }
wormhole-term = { path = "crates/wormhole-term" }
# The terminal engine, in a repository of its own (MIT): a pinned commit until it is on crates.io.
# The private checkout builds against a local copy instead; see `[patch]` in its .cargo/config.toml.
wormhole-vt = { git = "https://github.com/wormhole-terminal/wormhole-vt", rev = "4ae6ef4cebaba832d484fcf15f33814cdffc8a1b" }
wormhole-text = { path = "crates/wormhole-text" }
wormhole-wire = { path = "crates/wormhole-wire" }
anyhow = "1"
dirs = "7.0.0"
fluent-bundle = "0.16"
# Stays on 0.13: fluent-bundle 0.16 depends on it and on unic-langid. 0.14 moved to ICU4X types, so it
# would be a second, incompatible copy of the locale types in the tree.
fluent-langneg = "0.13"
fluent-syntax = "0.12"
intl_pluralrules = "7"
libc = "0.2"
plist = { version = "1.10.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
smol = "2"
toml = "1.1.6"
tracing = "0.1"
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
wildcard_imports = "warn"

# GPUI is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
# codegen-units stays at the default (16): with 1, the app crates' code generation ran on one core.

# Release, with the symbols a profiler needs (function names and source lines): the code is the
# same as the release build's (`cargo build --profile profiling`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
