[workspace]
members = ["crates/*"]
default-members = ["crates/wormhole"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/wormhole-terminal/wormhole"
publish = false

[workspace.dependencies]
wormhole-core = { path = "crates/wormhole-core" }
wormhole-vt = { path = "crates/wormhole-vt" }
anyhow = "1"
dirs = "7.0.0"
libc = "0.2"
plist = { version = "1.10.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
smol = "2"
toml = "1.1.6"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

# GPUI is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
# codegen-units stays at the default (16): with 1, the app crates' code generation ran on one core.
