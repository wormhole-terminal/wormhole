[workspace]
members = ["crates/*"]
default-members = ["crates/wormhole"]
resolver = "3"

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/wormhole-terminal/wormhole"
publish = false

[workspace.dependencies]
wormhole-core = { path = "crates/wormhole-core" }
wormhole-term = { path = "crates/wormhole-term" }
# The terminal engine, in a repository of its own (MIT): a pinned commit until it is on crates.io.
# The private checkout builds against a local copy instead; see `[patch]` in its .cargo/config.toml.
wormhole-vt = { git = "https://github.com/wormhole-terminal/wormhole-vt", rev = "a9c740620c3e64818b8a48d802d0b4ef24162caa" }
wormhole-text = { path = "crates/wormhole-text" }
wormhole-wire = { path = "crates/wormhole-wire" }
anyhow = "1"
dirs = "7.0.0"
fluent-bundle = "0.16"
# Stays on 0.13: fluent-bundle 0.16 depends on it and on unic-langid. 0.14 moved to ICU4X types, so it
# would be a second, incompatible copy of the locale types in the tree.
fluent-langneg = "0.13"
fluent-syntax = "0.12"
intl_pluralrules = "7"
libc = "0.2"
# The unstable feature only makes `plist::stream` public: the importer walks a property list's events,
# with no value built, to refuse one nested deeper than any real file (`import/plist_value.rs`). The
# tilde keeps it on the minor release whose API that is.
plist = { version = "~1.10.1", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
smol = "2"
toml = "1.1.6"
tracing = "0.1"
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
# A `pub` nothing outside the crate can name is `pub(crate)` (R-13). The app is a binary, where every `pub`
# is crate-wide: it allows the lint at its root.
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
wildcard_imports = "warn"
# `foo/mod.rs` for a folder module, never `foo.rs` beside a `foo/` (R-12). Not its opposite, `mod_module_files`.
self_named_module_files = "warn"

# GPUI is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
# codegen-units stays at the default (16): with 1, the app crates' code generation ran on one core.

# Release, with the symbols a profiler needs (function names and source lines): the code is the
# same as the release build's (`cargo build --profile profiling`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# gpui-pre 0.3.9 with three changes Wormhole needs, in a fork of its own (Apache-2.0, `NOTICE` there lists the
# files): a cached view's accessibility nodes and action listeners are replayed when it is reused (otherwise
# the chrome drops out of the tree at every cached frame while an assistive app is connected, so
# `window::cached` could not cache it then), the scene sort allocates nothing per frame (3.3 MB a frame
# in a truecolor terminal) while ordering exactly as the stable sort did, and an animation's frame cap
# (`with_max_fps`) renders on the display's frames, evenly spaced (a timer between them made the tiles'
# lights stutter). The version is the published one, so
# gpui-kit, gpui-base and gpui-component, which only ask for it, take the fork without changes.
# Upstream: all are being offered to zed-industries/zed, not yet sent. Drop this entry once a gpui-pre
# release has them (the fork's README says how).
[patch.crates-io]
gpui-pre = { git = "https://github.com/wormhole-terminal/gpui-pre", rev = "23d7780ae739b33f239a865a73aacb82fc7403ed" }
