[package]
name = "wormhole-ffi"
description = "The Swift UI experiment's seam: a terminal of the real engine behind UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `staticlib` goes into the xcframework; `lib` lets the tests link it.
crate-type = ["staticlib", "lib"]

[dependencies]
# `dev-key`: Probe approvals and the other sealed stores keep their keys in files of the experiment's own data
# folder, never in the login Keychain (the experiment never touches it); drop it when the Swift app ships.
wormhole-core = { path = "../../crates/wormhole-core", features = ["dev-key"] }
wormhole-term = { path = "../../crates/wormhole-term" }
wormhole-text = { path = "../../crates/wormhole-text" }
anyhow = "1"
tracing = "0.1"
semver = "1"
uniffi = "0.32"
thiserror = "2"
# Blocks the event thread on `PtyEvents::recv`, which is async (already in the tree through core).
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
flate2 = "1.1"
minisign = "0.9"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tiny_http = "0.12"
wormhole-term = { path = "../../crates/wormhole-term", features = ["test-support"] }
