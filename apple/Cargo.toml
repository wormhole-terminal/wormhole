# The Swift UI experiment's Rust side, a workspace of its own so that nothing here reaches the app's
# `Cargo.lock`, `cargo deny`, `licenses.json` or `scripts/structure.py` (`tools/bench` is the precedent).
# The app's crates come in by path; none of them may name anything in here.
[workspace]
members = ["ffi"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/wormhole-terminal/wormhole"
publish = false

# The root workspace's lints, repeated: a package inherits the lints of its own root.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
wildcard_imports = "warn"
self_named_module_files = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
