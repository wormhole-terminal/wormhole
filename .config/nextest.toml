# cargo-nextest settings; CI runs `cargo nextest run --workspace --features devctl --locked --profile ci`.
# `cargo test --workspace --features devctl` stays the local gate and ignores this file.

[profile.default]
# A test that hangs is reported as slow after 15 s and killed after 60 s, instead of holding the job
# until its timeout-minutes. Failures don't stop the run: one pass shows every broken test.
slow-timeout = { period = "15s", terminate-after = 4 }
fail-fast = false

# Tests whose assertions race a wall clock (deadlines, grace periods, sleeps). Run at full
# parallelism next to the PTY and GPUI tests on a loaded CI runner they miss their windows; two at
# a time leave them the CPU.
[test-groups]
wall-clock = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/^ipc::server::/) | test(/^git::cmd::tests::a_/) | (binary(git_repo) & test(/stall|huge|too_large|without_commits/)) | test(/relaunch/)'
test-group = 'wall-clock'

[profile.ci]
retries = 0

# The repaint's bisimulation replays every case and corpus thousands of times: about 30 s in a debug
# build on a laptop, past a minute on a loaded runner. Slow by design, not hung; give it four minutes.
[[profile.ci.overrides]]
filter = 'binary_id(wormhole-vt-bench::bisimulation)'
slow-timeout = { period = "60s", terminate-after = 4 }

# The app's window tests start real terminals whose reader thread can reach GPUI's deterministic test
# scheduler, which fails a test now and then on a loaded runner (https://github.com/wormhole-terminal/wormhole/issues/3). One retry, reported as
# FLAKY, until that is fixed; then remove this override.
[[profile.ci.overrides]]
filter = 'binary_id(wormhole::bin/Wormhole)'
retries = 1

# target/nextest/ci/junit.xml; the CI job uploads it.
[profile.ci.junit]
path = "junit.xml"
