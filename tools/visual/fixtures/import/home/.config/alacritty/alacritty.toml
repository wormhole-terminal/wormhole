[font]
size = 12.0

[font.normal]
family = "Menlo"

[window]
opacity = 0.95
padding = { x = 6, y = 6 }

[scrolling]
history = 8000

[terminal.shell]
program = "/bin/bash"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[cursor]
style = "Beam"

[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"
