name: Feature request
description: Suggest something Wormhole could do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search the existing issues first; if someone has asked already, add a 👍 or what your case adds.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it now?
      description: A workaround, another terminal or tool, or not at all.
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. A rough idea of what it could look like is enough.
