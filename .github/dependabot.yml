# Keeps the workflows' actions current. Rust dependencies get security updates only (turned on in
# the repository's settings): GPUI pins much of the tree, so routine bumps go through by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Its tag is the Rust version: it moves with rust-toolchain.toml, by hand (ci.yml's fmt job
      # fails when they differ).
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
