# A stable release: build.yml builds, signs, notarizes and publishes it as a GitHub Release.
# Needs the Developer ID certificate, the notarization key and the updater key as secrets of the
# `release` environment, and PUBLIC_BASE_URL as a variable: the address the app checks for updates
# (<base>/stable/latest.json), which redirects to the latest release's latest.json.
#
# - Push an annotated tag vX.Y.Z (must equal workspace.package.version; scripts/release.sh makes the
#   commit and the tag) -> full release, unless that release already exists. The release notes are the
#   version's section of CHANGELOG.md (scripts/changelog.py notes); a Security entry there makes the
#   release a security update in latest.json (see RELEASE_SEVERITY in scripts/package.sh). Then the
#   website rebuilds through its deploy hook and shows the release at once.
#   Before anything is signed or published, a minor or major release (vX.Y.0), and a patch release whose
#   diff since the previous release touches what talks to a session host, drive the hosts of the last two
#   releases with this build's client (scripts/previous-hosts.sh); a failure stops the release.
# - Run manually (workflow_dispatch) -> build + package only; tick "publish" to also create the
#   GitHub Release.
# The builds of main are preview.yml's.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (otherwise only build + package)"
        type: boolean
        default: false
      run_tests:
        description: "Run the whole test suite on the runner first (off: the local gate already ran it)"
        type: boolean
        default: false
      check_hosts:
        description: "Also drive the session hosts of the last two releases with this build's client (a release does it on its own when it must); publishes nothing by itself"
        type: boolean
        default: false

# Read-only for every job; the build job asks for what it writes (zizmor: excessive-permissions).
permissions:
  contents: read

jobs:
  # A cheap Linux job that decides whether the macOS one is needed at all. Its output decides whether
  # the signing job runs, so it checks nothing out: nothing of the commit can run here.
  gate:
    name: Anything to build?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The tag's own name: the build stops a tag that differs from Cargo.toml's version.
            skip=true
            echo "::notice::The release $GITHUB_REF_NAME already exists: nothing to build"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # Whether the session hosts of the last two stable releases must be driven by this build's client before
  # anything is published (scripts/previous-hosts.sh): always for a minor or major release (vX.Y.0), for a
  # patch release only when the code that talks to a host changed since the previous release. Like the gate,
  # its output decides whether a job with secrets runs, so it runs nothing from the commit it checks out:
  # git reads the tags and the list of changed files as data, and that is all.
  hosts_plan:
    name: Do earlier session hosts need checking?
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0 # every tag, and the history between two of them
      - id: plan
        env:
          CHECK_BY_HAND: ${{ inputs.publish == true || inputs.check_hosts == true }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            # A manual run checks when it publishes or when asked to; a build that does neither has nothing
            # to hold back.
            run="$CHECK_BY_HAND"
            echo "Manual run: the check runs when it publishes or is asked for ($run)"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" != 0 ]; then
            # A patch release: the newest plain release tag before this one is what it is compared with.
            previous="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V \
              | awk -v current="$GITHUB_REF_NAME" '$0 == current { print last; exit } { last = $0 }')"
            if [ -z "$previous" ]; then
              echo "No earlier release tag to compare with: the check runs"
            else
              # On its own line: a git that fails aborts the step (the shell stops on an error), so the
              # check is never skipped by a failure.
              changed="$(git diff --name-only "$previous" "$GITHUB_SHA")"
              # Skipped only when no code, dependency, toolchain or the script itself changed: any of
              # them can change what a host and the client say to each other.
              if printf '%s\n' "$changed" \
                | grep -Eq '^(crates/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|scripts/previous-hosts\.sh$)'; then
                echo "Code changed since $previous: the check runs"
              else
                run=false
                echo "Nothing but documents and workflows changed since $previous: no check"
              fi
            fi
          else
            echo "A minor or major release (or a version with a suffix): the check runs"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The hosts of the last two stable releases, started and driven by this build's client. A host outlives the
  # app, so after an update today's app talks to what an earlier release started. It runs the commit's own
  # script and tests, so it holds nothing but a read-only token (`gh release download`, `gh attestation
  # verify`); the release's secrets belong to `build`, which waits for this job.
  #
  # Never add a cache step here: what it restored would be code of this job, and its result gates `build`,
  # which signs and publishes (zizmor: cache-poisoning). It builds from nothing, as `build` does.
  previous_hosts:
    name: Earlier session hosts still work
    needs: hosts_plan
    if: needs.hosts_plan.result == 'success' && needs.hosts_plan.outputs.run == 'true'
    permissions:
      contents: read
      # `gh attestation verify` reads the release's attestations; a public repository shows them to anyone, a
      # private one to this permission.
      attestations: read
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - name: Drive the last two releases' hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/previous-hosts.sh

  build:
    needs: [gate, hosts_plan, previous_hosts]
    # A status function (`!cancelled()`): without one GitHub adds `success()`, which is false whenever a needed
    # job (here `previous_hosts`, when the plan says no check) was skipped, and nothing would be built. The
    # results are then said one by one. The check passed, or it was not wanted: the plan ran and said `false`
    # (an empty output is not `false`, so a plan that gave nothing stops the release). A failed plan or a
    # failed check publishes nothing.
    if: >-
      ${{ !cancelled()
      && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true'
      && needs.hosts_plan.result == 'success'
      && (needs.previous_hosts.result == 'success'
      || (needs.previous_hosts.result == 'skipped' && needs.hosts_plan.outputs.run == 'false')) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    # `./` and not GitHub's newer `$/` (zizmor: self-repository): actionlint doesn't know `$/` yet, and a
    # reusable workflow named with `./` comes from the same commit as this one anyway.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      channel: stable
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      run_tests: ${{ inputs.run_tests == true }}
      build_sha: ${{ github.sha }}
    # Environment secrets are reported empty in a called workflow without this (actions/runner#4453). The
    # repository has no repository or organization secrets, so it passes nothing; build.yml's come from
    # its environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # The website reads the version from the update feed and the notes from CHANGELOG.md while it builds;
  # it rebuilds on its own every two hours, and at once through its deploy hook. WEBSITE_DEPLOY_HOOK is
  # that hook's URL, a secret of the `release` environment: whoever has it can start a build of the site
  # and nothing else.
  website:
    name: Tell the website
    needs: build
    # `!cancelled()` and the result: `build` ran behind a skipped `previous_hosts`, and the implicit `success()`
    # looks at every job before this one.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.prerelease == 'false' && (github.event_name == 'push' || inputs.publish == true) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::No WEBSITE_DEPLOY_HOOK: the website shows $VERSION after its next scheduled sync (every two hours)"
            exit 0
          fi
          # The URL stays in the environment: curl names no URL in an error, and GitHub masks secrets anyway.
          curl -fsS -o /dev/null -X POST --max-time 30 "$HOOK"
          echo "The website rebuilds with $VERSION now"
