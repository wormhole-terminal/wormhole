name: CI

# Pull requests get format, macOS (the structure checker, clippy, every test), licenses and history
# (commit rules, changelog); a push to main gets the macOS jobs again. Nothing builds on Linux here: the
# app is macOS-only (cloud sessions build on Linux themselves). Push and pull request runs are skipped while
# the repository is private, where macOS minutes cost money; a run started by hand (Actions → CI → Run workflow, or
# `gh workflow run CI`) always goes. Run `scripts/check.sh` before pushing all the same.
#
# A push that only changes the root's Markdown or GitHub's templates and README images starts nothing,
# not even a preview build (Preview follows CI); scripts/check.sh already ran design_rules, the one
# test that reads them. Markdown under crates/ and .claude/ is compiled in or tested, so it still runs;
# pull requests always run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/readme/**"
  pull_request:
  # Every day, the whole workspace whatever changed: pushes to main are scoped (Scope), so this is the
  # net under the scope table. Zed scopes pull requests and runs everything on main; we push to main.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      build_only:
        description: Only build the nightly app, skip fmt, clippy, tests and deny (cheapest)
        type: boolean
        default: true

# A newer commit replaces a pull request's run in progress. On main, runs finish (a newer one
# waits): only a finished run on main saves the build cache that every later run and pull request
# starts from, and cancelling them left none.
# Read-only unless a job says otherwise (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough for backtraces; full DWARF made the cached target dirs several times larger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The Rust version, its components and profile are rust-toolchain.toml's: `rustup toolchain install`
# reads it, as cargo does locally, so a Rust bump is that one file.
jobs:
  # What the change reaches, from the same table the local gate uses (scripts/check.sh --scope): the
  # macOS jobs build only as much as that, because their time is the build (about 8 of 11 minutes in the
  # tests job), not the tests. Seconds, on Ubuntu. Anything unknown, a manual run and a push whose
  # previous commit is unknown get the whole workspace, as check.sh does; so does a scope this job does
  # not know, so a broken lookup runs too much, never too little. The structure check runs here for every
  # change: it reads the sources as text, in a second, and a change to its own rules or allowlist is a
  # `text` change that builds nothing.
  scope:
    name: Scope
    if: ${{ !inputs.build_only && (github.event_name == 'workflow_dispatch' || !github.event.repository.private) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clippy: ${{ steps.scope.outputs.clippy }}
      test: ${{ steps.scope.outputs.test }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Structure (module rules, OS edge, file sizes)
        run: |
          python3 scripts/structure.py selftest
          python3 scripts/structure.py check
      - name: The scope table matches the crates and what they include
        run: scripts/check.sh --selftest
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$(git merge-base "$PR_BASE" HEAD)" ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base="$BEFORE" ;;
          esac
          scope=all
          if [ -n "$base" ]; then
            scope="$(scripts/check.sh --scope --base "$base" | sed -n 's/^scope=//p')"
          fi
          echo "scope: $scope (base: ${base:-none})"
          case "$scope" in
            all)  clippy="--workspace --all-targets --features devctl"; test="--workspace --features devctl" ;;
            # The source checks (wormhole-rules) read the app's sources, so an app change runs them too.
            app)  clippy="-p wormhole -p wormhole-rules --all-targets --features wormhole/devctl"
                  test="-p wormhole -p wormhole-rules --features wormhole/devctl" ;;
            # They link std alone: a wording or rule change compiles nothing of the app.
            text) clippy="-p wormhole-rules --all-targets";               test="-p wormhole-rules" ;;
            none) clippy="";                                             test="" ;;
            *)    echo "::warning::unknown scope '$scope': checking everything"; scope=all
                  clippy="--workspace --all-targets --features devctl"; test="--workspace --features devctl" ;;
          esac
          # Only a whole-workspace build may save the cache on main: a partial one saved under the key
          # (after the old entry was evicted) would leave every later run to build the rest from scratch.
          [ "$scope" = all ] && echo "full=true" >> "$GITHUB_OUTPUT"
          echo "clippy=$clippy" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    if: github.event_name != 'push' && !inputs.build_only && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  # Everything that builds on macOS: the whole workspace (core included), not only the app crate.
  # Clippy and the tests are two jobs side by side: they share little of their builds anyway (clippy
  # stops before code generation), and each keeps a cache of its own.
  clippy:
    name: macOS (clippy)
    needs: scope
    if: ${{ needs.scope.outputs.clippy != '' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' && needs.scope.outputs.full == 'true' }}
      # Through the environment, not spliced into the script (zizmor: template-injection): the
      # arguments are Scope's own table, and they split into words on purpose.
      - env:
          CLIPPY_ARGS: ${{ needs.scope.outputs.clippy }}
        run: |
          # shellcheck disable=SC2086 # the arguments split into words on purpose
          cargo clippy $CLIPPY_ARGS --locked -- -D warnings

  test:
    name: macOS (tests)
    needs: scope
    if: ${{ needs.scope.outputs.test != '' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' && needs.scope.outputs.full == 'true' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest
      # devctl turns on GPUI's test support: the settings and view tests only compile with it.
      # nextest runs every test in its own process and bounds the slow ones (.config/nextest.toml);
      # it runs no doctests, and the workspace has none (the one fenced block is `text`).
      - env:
          TEST_ARGS: ${{ needs.scope.outputs.test }}
        run: |
          # shellcheck disable=SC2086 # the arguments split into words on purpose
          cargo nextest run $TEST_ARGS --locked --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The commit rules and the changelog (CONTRIBUTING.md: "Commits", "Changelog"), on Ubuntu and in
  # seconds. The title is checked because a squash merge uses it as the commit's header. Title and
  # labels are read from the API, so "Re-run job" after editing the title or adding the label
  # `no changelog` sees the change (the event payload of a re-run is the old one). Dependabot's
  # pull requests are left out: its titles are its own.
  history:
    name: History
    if: github.event_name != 'push' && github.actor != 'dependabot[bot]' && !inputs.build_only && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Selftests
        run: |
          python3 scripts/commits.py selftest
          python3 scripts/changelog.py selftest
      - name: CHANGELOG.md is well formed
        if: ${{ !cancelled() }}
        run: python3 scripts/changelog.py check
      - name: Commits follow the rules
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/commits.py check-range "$BASE..$HEAD"
      - name: Title and label
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The title is untrusted input: it only ever goes through a variable and a file.
          gh pr view "$PR" --json title --jq .title > "$RUNNER_TEMP/title.txt"
          # 92, not 100: a squash merge adds " (#1234)" to the header.
          python3 scripts/commits.py check-message --max-length 92 "$RUNNER_TEMP/title.txt"
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx 'no changelog'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: A user-visible change has a changelog entry
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.pr.outputs.skip != 'true' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/commits.py changelog-needed "$BASE..$HEAD"

  deny:
    name: Licenses & advisories
    if: github.event_name != 'push' && !inputs.build_only && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # Dependencies a crate declares but no longer uses: each still builds, and is one more to audit.
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-shear@1.14.0
      - run: cargo shear

  # The shell scripts and the workflows, linted in seconds with nothing built (scripts/lint-scripts.sh:
  # shellcheck, actionlint, zizmor), on every run: a broken or unsafe workflow otherwise shows only
  # when it runs. Zed runs the same three.
  scripts:
    name: Workflows & scripts
    if: ${{ !inputs.build_only && (github.event_name == 'workflow_dispatch' || !github.event.repository.private) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shellcheck@0.11.0,zizmor@1.30.1
      # install-action has no actionlint: the release's own binary, checked against its published SHA-256.
      - name: actionlint 1.7.12
        run: |
          v=1.7.12 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sum  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/lint-scripts.sh --require

  # One result for the whole run: every check passed, or was skipped because the change doesn't reach
  # it (Scope) or the event doesn't need it. A failed or cancelled job fails this one, and so does a
  # failed Scope, whose skipped macOS jobs would otherwise look like a pass. If main ever requires a
  # status check, this is the one to require: its name stays while the jobs behind it change.
  check:
    name: Check
    if: ${{ always() }}
    needs: [scope, fmt, clippy, test, history, deny, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi

  # Ad-hoc signed app, built on demand (Actions > CI > Run workflow, "Only build" is on by default,
  # `gh workflow run CI -f build_only=false` adds the checks): download it
  # from the run's Artifacts (GitHub login required). Unzip the artifact, then the
  # inner zip; the app is not notarized, so right-click > Open on first launch.
  nightly:
    name: Nightly app (ad-hoc signed)
    # No `needs: [clippy, test]`: with build_only the checks are skipped, and a skipped dependency would skip
    # this job too. The checks still run when the box is unticked, in parallel instead of first.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/bundle.sh
      # ditto keeps the executable bit and code signature; upload-artifact alone would not.
      - run: ditto -c -k --keepParent target/release/Wormhole.app "Wormhole-nightly-${GITHUB_SHA::7}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wormhole-nightly-${{ github.sha }}
          path: Wormhole-nightly-*.zip
          retention-days: 14
