name: Swift app

# The Swift app (macos/, with its bridge crate crates/wormhole-ffi): the Rust library, a release build of the app,
# every Swift test and the end-to-end suite, the bundle that ships as Wormhole Beta (ad hoc signed, built and started as
# beta.yml builds it), and the bridge's dependencies, licences and changelog, on GitHub runners instead of a developer's Mac. Pushes to main that reach it, or by hand
# (Actions → Swift app → Run workflow, or `gh workflow run "Swift app" --ref <branch>`). It uses no secret and
# publishes nothing (a failed end-to-end run keeps its logs as a run artifact for a week), and no other workflow waits for it: the app that ships is the CI workflow's.
on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "crates/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "packaging/**"
      - "scripts/lib.sh"
      - "scripts/check-entitlements.sh"
      - "scripts/changelog.py"
      - "scripts/gen-licenses.py"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run in progress: only the newest state of the branch is worth a runner.
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-test:
    name: Build and test
    # The app is developed with Xcode 27; the runner has Xcode 26 (Swift 6.3), which the package says it builds
    # with. There is no macOS 27 runner yet (a job asking for one stays queued).
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version, components and profile are rust-toolchain.toml's.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "crates/wormhole-ffi -> target"
      # The app is developed with the newest Xcode; the runner's default may be a release behind (Swift 6.3.3 crashed
      # compiling TerminalUI). Take the newest Xcode the image has.
      - name: Newest Xcode
        run: |
          printf '%s\n' /Applications/Xcode*.app
          newest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          echo "selected $newest"
      - name: Versions
        run: |
          sw_vers
          swift --version
          cargo --version
      - name: Rust library and bindings
        run: macos/scripts/build-ffi.sh swift
      - name: Release build
        working-directory: macos/swift
        run: swift build -c release
      # The hosting tests and the end-to-end hosting scenarios start a real session host and skip without one: the host
      # binary where they look for it (a debug build in the bridge's own target folder).
      - name: Session host for the hosting tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/wormhole-ffi/target
        run: cargo build -p wormhole-host
      # The bridge is a cargo workspace of its own, so the CI workflow's fmt, clippy and tests never reach it:
      # the same three commands scripts/check.sh runs for it, in its folder (its .cargo/config.toml gives the tests
      # their data folder, and cargo reads that file from the working directory). After the session host is built:
      # its hosting tests build the host themselves when it is missing, inside a test's own 15 s deadline.
      - name: The bridge's format, lints and tests
        working-directory: crates/wormhole-ffi
        run: |
          cargo fmt --all -- --check
          cargo clippy --quiet --workspace --all-targets -- -D warnings
          cargo test --quiet
      # The tests start real terminals: they make their own scratch data folders and refuse any other. The end-to-end
      # suite is the next step's.
      - name: Tests
        working-directory: macos/swift
        run: |
          set -o pipefail
          swift test --skip EndToEndTests 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      # The built app as a background test instance on scratch folders, driven through its control folder
      # (macos/parity/DRIVING.md, "End-to-end tests"). It never takes the focus, touches the clipboard, Trash, browser or
      # editor, or reads a real home; a failure leaves its control files, log and config.json in the artifact below.
      - name: End-to-end tests
        working-directory: macos/swift
        timeout-minutes: 80
        env:
          WORMHOLE_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          set -o pipefail
          mkdir -p "$WORMHOLE_E2E_ARTIFACTS"
          swift test --filter EndToEndTests 2>&1 | tee "$RUNNER_TEMP/swift-e2e.log"
      - name: End-to-end files, if it failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-e2e
          path: |
            ${{ runner.temp }}/e2e-artifacts
            ${{ runner.temp }}/swift-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      # A compiler crash names no source line: build the module file by file and say which file it was in.
      - name: Where the compiler crashed, if it did
        if: failure()
        working-directory: macos/swift
        run: |
          swift build -c release --target TerminalUI -Xswiftc -no-whole-module-optimization > "$RUNNER_TEMP/narrow.log" 2>&1 || true
          grep -E "Program arguments" "$RUNNER_TEMP/narrow.log" | grep -oE "primary-file [^ ]+" | sort | uniq -c || true
          grep -E "While |error:" "$RUNNER_TEMP/narrow.log" | sort -u | head -20 || true
      - name: Failures, if any
        if: failure()
        run: grep -E "error:|recorded an issue|failed" "$RUNNER_TEMP/swift-test.log" "$RUNNER_TEMP/swift-e2e.log" 2> /dev/null | sort -u | head -80 || true
      # Not here yet: the Swift static checks (macos/scripts/quality.sh). Its no-polling rule still names waits in
      # the tests and five in the app; the step lands with the change that clears them.

  # Wormhole Beta as it ships, without a secret: macos/scripts/bundle.sh builds the universal app with this runner's
  # newest Xcode and `--build-system swiftbuild` and signs it ad hoc, and macos/scripts/check-bundle.sh checks it and
  # starts a copy outside the checkout (a background test instance: scratch HOME, /bin/cat for a shell), which proves that
  # the resource bundles resolve from the app's own Contents/Resources. beta.yml (through build.yml) builds it the same
  # way before it signs. No cache: what is checked here is a build from nothing, as a release's is.
  bundle:
    name: Wormhole Beta bundle (ad hoc)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain and the Intel target
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin
      - name: Newest Xcode
        run: |
          newest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          echo "selected $newest"
          swift --version
      - name: Bundle
        run: macos/scripts/bundle.sh
      - name: Check the bundle and run a copy of it
        run: macos/scripts/check-bundle.sh

  # What the root workspace's checks do not see, in seconds on Linux: the bridge is a cargo workspace of its own, so its
  # dependencies get `cargo deny` with the root's deny.toml (as scripts/check.sh runs it), both licence lists are compared
  # with the locks, and the beta's changelog is checked as its release reads it.
  bridge:
    name: Bridge dependencies, licences and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (the bridge's Cargo.lock)
        run: cargo deny --config deny.toml --manifest-path crates/wormhole-ffi/Cargo.toml check
      - name: Licence lists match the locks
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/wormhole-ffi/Cargo.toml
          python3 scripts/gen-licenses.py --check
          python3 scripts/gen-licenses.py --ffi --check
      - name: macos/CHANGELOG.md is well formed
        run: python3 scripts/changelog.py --file macos/CHANGELOG.md --tag-prefix beta- check
