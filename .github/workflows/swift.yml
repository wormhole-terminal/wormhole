name: Swift app

# The Swift app (macos/, with its bridge crate crates/wormhole-ffi): the Rust library, a release build of the app,
# every Swift test and the end-to-end suite, on a GitHub runner instead of a developer's Mac. Pushes to main that reach it, or by hand
# (Actions → Swift app → Run workflow, or `gh workflow run "Swift app" --ref <branch>`). It uses no secret and
# publishes nothing (a failed end-to-end run keeps its logs as a run artifact for a week), and no other workflow waits for it: the app that ships is the CI workflow's.
on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "crates/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run in progress: only the newest state of the branch is worth a runner.
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-test:
    name: Build and test
    # The app is developed with Xcode 27; the runner has Xcode 26 (Swift 6.3), which the package says it builds
    # with. There is no macOS 27 runner yet (a job asking for one stays queued).
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version, components and profile are rust-toolchain.toml's.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "crates/wormhole-ffi -> target"
      # The app is developed with the newest Xcode; the runner's default may be a release behind (Swift 6.3.3 crashed
      # compiling TerminalUI). Take the newest Xcode the image has.
      - name: Newest Xcode
        run: |
          printf '%s\n' /Applications/Xcode*.app
          newest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          echo "selected $newest"
      - name: Versions
        run: |
          sw_vers
          swift --version
          cargo --version
      - name: Rust library and bindings
        run: macos/scripts/build-ffi.sh swift
      - name: Release build
        working-directory: macos/swift
        run: swift build -c release
      # The hosting tests start a real session host and skip without one: the host binary where they look for it (a debug
      # build in the bridge's own target folder).
      - name: Session host for the hosting tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/wormhole-ffi/target
        run: cargo build -p wormhole-host
      # The tests start real terminals: they make their own scratch data folders and refuse any other. The end-to-end
      # suite is the next step's.
      - name: Tests
        working-directory: macos/swift
        run: |
          set -o pipefail
          swift test --skip EndToEndTests 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      # The built app as a background test instance on scratch folders, driven through its control folder
      # (macos/parity/DRIVING.md, "End-to-end tests"). It never takes the focus, touches the clipboard, Trash, browser or
      # editor, or reads a real home; a failure leaves its control files, log and config.json in the artifact below.
      - name: End-to-end tests
        working-directory: macos/swift
        timeout-minutes: 25
        env:
          WORMHOLE_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          set -o pipefail
          mkdir -p "$WORMHOLE_E2E_ARTIFACTS"
          swift test --filter EndToEndTests 2>&1 | tee "$RUNNER_TEMP/swift-e2e.log"
      - name: End-to-end files, if it failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-e2e
          path: |
            ${{ runner.temp }}/e2e-artifacts
            ${{ runner.temp }}/swift-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      # A compiler crash names no source line: build the module file by file and say which file it was in.
      - name: Where the compiler crashed, if it did
        if: failure()
        working-directory: macos/swift
        run: |
          swift build -c release --target TerminalUI -Xswiftc -no-whole-module-optimization > "$RUNNER_TEMP/narrow.log" 2>&1 || true
          grep -E "Program arguments" "$RUNNER_TEMP/narrow.log" | grep -oE "primary-file [^ ]+" | sort | uniq -c || true
          grep -E "While |error:" "$RUNNER_TEMP/narrow.log" | sort -u | head -20 || true
      - name: Failures, if any
        if: failure()
        run: grep -E "error:|recorded an issue|failed" "$RUNNER_TEMP/swift-test.log" "$RUNNER_TEMP/swift-e2e.log" 2> /dev/null | sort -u | head -80 || true
