[package]
name = "wormhole"
description = "Wormhole: a terminal for working with AI coding agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary name is what macOS shows in the menu bar and Dock.
[[bin]]
name = "Wormhole"
path = "src/main.rs"

[dependencies]
wormhole-core.workspace = true
# The terminal itself (a program in a PTY and the screen it draws); core only starts its programs.
wormhole-term.workspace = true
# The interface's words (Fluent catalogs, typed keys) and the language they are shown in.
wormhole-text.workspace = true
# Inline images: core's decoded pixels become GPUI's frames (its own image type; the crate is in
# the graph through GPUI with these features).
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = { version = "0.8.0", features = [
    # Retained views, kept layout and an allocation-free scene sort: a trial, see speed-research.md.
    "gpui-fast",
    # Syntax highlighting in the diff view.
    "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript",
    "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash", "tree-sitter-toml",
    "tree-sitter-yaml", "tree-sitter-markdown", "tree-sitter-css", "tree-sitter-html",
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-swift",
] }
anyhow.workspace = true
# The terminal's word caches hash text from programs' output: a fast hasher seeded at random.
foldhash = "0.2"
# System-wide show/hide hotkey (Carbon RegisterEventHotKey on macOS; no extra permissions).
# Cross-platform so the key-spec parser builds (and is tested) off macOS too.
global-hotkey = "0.8.0"
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
smol.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSError", "NSString", "NSArray", "NSObject", "NSSet", "NSBundle", "NSAttributedString", "NSRange", "NSDictionary", "NSData", "NSNotification", "NSUserDefaults", "NSOperation", "NSFileManager", "NSLocale"] }
# Notifications from the bundled app: interruption levels (Time Sensitive), threads, actions and
# Reply, which GPUI's own notifications don't carry.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "bitflags", "UNNotification", "UNNotificationAction", "UNNotificationCategory",
    "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings",
    "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter",
] }
# Font pickers: which installed families are monospace (CoreText traits + advances);
# the user's font files registered for this process (CTFontManager).
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFCGTypes", "CFURL", "CFError", "CFData"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontTraits", "CTFontManager", "CTFontManagerErrors", "objc2-core-graphics"] }
# A glyph's outline (CTFontCreatePathForGlyph's CGPath), for double-width rows: the terminal
# draws them stretched, as an SVG mask, because GPUI's glyph painting has no transform.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPath"] }
# Touch ID / password approval for trusting project folders.
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
# The intro's overlay: a CAMetalLayer drawn by our own shader (GPUI has no custom shaders).
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std", "MTLAllocation", "MTLBlitCommandEncoder", "MTLCommandBuffer", "MTLCommandEncoder",
    "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder",
    "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "CATransform3D", "objc2-core-foundation", "objc2-metal",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSView", "NSResponder", "NSVisualEffectView", "NSGlassEffectView", "NSGraphics",
    # A plain fill under the glass while the window isn't blurred.
    "NSBox",
    # Where the traffic lights are (the title rows' chrome sits after them).
    "NSWindow",
    # Menu bar item.
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSMenu", "NSMenuItem",
    "NSImage", "NSColor", "NSFont", "NSCell", "NSEvent",
    # Dock badge and bounce; the status item's own drawing (dot, check, working frames).
    "NSApplication", "NSDockTile", "NSBezierPath", "NSGraphicsContext", "NSGraphics", "block2",
    # The menu rows' right-aligned times.
    "NSAttributedString", "NSParagraphStyle", "NSText",
    # Background mode's test instances: no Dock icon (an accessory app).
    "NSRunningApplication",
    # The scrollbar style the system asks for.
    "NSScroller",
    # The question before quitting, with its checkbox.
    "NSAlert",
    # Files' icons in the path menu, and the row of colour dots in the group menu (a custom view with
    # mouse tracking, a tooltip and VoiceOver).
    "NSWorkspace", "NSTrackingArea", "NSAccessibility", "NSAccessibilityProtocols",
    "NSAccessibilityConstants",
    # The popovers' native controls, and the Colours window.
    "NSPopover", "NSViewController", "NSStackView", "NSTextField", "NSTextFieldCell", "NSColorPanel",
    "NSColorSpace", "NSAppearance", "NSPanel", "NSLayoutAnchor", "NSLayoutConstraint", "NSTextView",
    "NSBitmapImageRep", "NSImageRep", "NSLayoutGuide", "NSControl", "NSButtonCell",
] }

[dev-dependencies]
# The render tests build terminals without a PTY (`wormhole_term::testing`), which the shipped build
# never has: dev-dependency features are off in it.
wormhole-term = { workspace = true, features = ["test-support"] }
# `with_language`: a test's own language, so tests that read the wording run in `en` and `en-XA` side by side.
wormhole-text = { workspace = true, features = ["test-support"] }
# The view tests drive real windows through GPUI's test platform, so a plain `cargo test` (what CI
# and contributors run) needs these without the devctl feature. Dev-dependency features are
# never active in the shipped binary.
gpui-kit = { version = "0.8.0", features = ["test-support"] }

[features]
# Dev-only control hook (screenshots + scripted input) for automated checks.
devctl = ["gpui-kit/test-support", "wormhole-core/dev-key", "wormhole-term/perf-counters"]
# Inspect mode (⇧⌥⌘I) in release builds too; debug builds always have it.
inspector = ["gpui-kit/inspector"]

[lints]
workspace = true
