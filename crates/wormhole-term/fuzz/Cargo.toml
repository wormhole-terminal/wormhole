[package]
name = "wormhole-term-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wormhole-term = { path = ".." }
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "checkpoint_read"
path = "fuzz_targets/checkpoint_read.rs"
test = false
doc = false
bench = false

# Its own workspace: the fuzz crate needs a nightly toolchain and is run by hand, so the
# repository's workspace (and `cargo check --workspace`) must not see it.
[workspace]
