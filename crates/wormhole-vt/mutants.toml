# cargo-mutants configuration for the engine (decision D-22; run it with scripts/mutants.sh,
# docs in docs/tools.md). Every exclusion says why; an equivalent mutant (no observable difference)
# goes in the second list with its reason, never silently.

# The tests that judge a mutant: the engine's own (unit, allocation counters, invariants, structure)
# and the bench crate's, which hold the .vtt conformance runner and the differential tests.
test_package = ["wormhole-vt", "wormhole-vt-bench"]

# Only the libraries and the integration tests, for the build and the run: no examples (their logic
# runs in tests/examples.rs), no doctests and none of the bench crate's tool binaries, which every
# mutant would otherwise build again (they were most of the 40 s a mutant's build took).
additional_cargo_args = ["--lib", "--test", "*"]

# nextest runs the test binaries side by side instead of one after another, and stops at the first
# failure, which is how most mutants end.
test_tool = "nextest"

# A mutant that turns a loop endless must end as "timeout", which counts as caught. The tests run in
# about ten seconds, so a generous multiple of that is a hang and not a slow machine.
timeout_multiplier = 3.0
minimum_test_timeout = 60

# Whole files that are not the engine's behaviour.
exclude_globs = [
    # Generated by scripts/gen-unicode.py from the Unicode data files; the tables are checked
    # against those files by tests/unicode_*.rs, and a mutated table is a different table.
    "**/src/unicode/tables.rs",
    # Internals tooling behind the `internals` feature (a state dump for the bisimulation tests):
    # it is the measuring stick, not the thing measured.
    "**/src/terminal/dump.rs",
    # The invariants checkers (grid and terminal) the tests call; a mutant here weakens a test, it never changes what
    # the engine does, and the structure of the checks is itself under test in tests/invariants/.
    "**/src/grid/check.rs",
    "**/src/terminal/check.rs",
]

exclude_re = [
    # Formatting only. Nothing in the engine parses its own Debug or Display output.
    "impl (std::)?(fmt::)?(Debug|Display) for",
    # Capacity hints change speed and memory, never a result; the allocation counters in
    # tests/*_allocations.rs guard the speed.
    "Vec::with_capacity",

    # Equivalent mutants found by the first run (no observable difference): see the list the run
    # produced, one line each with the reason. Added below as they are decided. A regex names the
    # function when every mutant of that kind in it is equivalent, and the line and column (which
    # drift: a mutant that comes back after an edit above it is checked again) when the function
    # has others of that kind that a test does catch.

    # -- grid/cell.rs: a style id and a code point fill exactly the bits the mask just cleared.
    "replace \\| with \\^ in Cell::with_style",
    "replace \\| with \\^ in Cell::with_codepoint",
    # The three fields of a word (code point, style id, flags) fill places that do not overlap, and
    # so do the two masks that make `NEEDS_RELEASE`.
    "replace \\| with \\^ in Cell::compose",
    "grid/cell\\.rs:90:39: replace \\| with \\^",
    # Every caller asks for the grapheme and the hyperlink itself once inside: this only skips that.
    "replace Cell::has_side_entry -> bool with true",
    # What the repaint does with a cell that has no character: only the tab mark, the spacers' flags
    # (both tested before it) and a mark with nothing to combine with are ever on one, because
    # nothing the engine writes puts another flag on a cell without a code point.
    "replace Cell::flags_but_tab -> u16 with 0",

    # -- grid/copy.rs
    # A cell's style never has layout bits (the style table strips them), so OR and XOR of the two
    # agree; so do the two flags (distinct bits) of the extras test.
    "replace \\| with \\^ in Grid::draw_cell",
    "replace \\| with \\^ in copy_page_row",
    # A zero code point is a zero byte, which has no bit in common with the 0x20 it becomes; and
    # 0x80 is U+0080 either way.
    "replace \\| with \\^ in drawn_char",
    "replace < with <= in drawn_char",

    # -- grid/edit.rs: `erase_cells` is reached from `erase`, which has refused an empty or outside
    # range already, and from scrolls that pass rows and columns inside the screen.
    "replace \\|\\| with && in Grid::erase_cells",

    # -- grid/history.rs
    # With one page, that page holds the live rows, so the loop's own check of the first page
    # ends it whether or not the condition lets it start.
    "history\\.rs:57:32: replace > with >= in Grid::enforce_limit",
    # An empty history is no work either way: nothing is dropped from zero rows.
    "history\\.rs:65:50: replace > with >= in Grid::enforce_limit",
    # Asked for none, the loop's pass over zero rows records and drops nothing; a lone page is
    # never longer than the history asked for, which is at most the history.
    "replace > with >= in Grid::drop_history_rows",
    # Scrolling the screen's used rows by none does nothing.
    "replace > with >= in Grid::scroll_screen_into_history",

    # -- grid/images/
    # No placement starts on a row below the last: the invariants refuse it.
    "view\\.rs:46:19: replace < with <= in Hit::on_screen",
    # `drop_headless` has dropped every placement right of the new edge before the rebuild, and the
    # carried anchors stay inside it, so none is left for this to drop.
    "mod\\.rs:264:9: replace Grid::drop_placements_off_screen with \\(\\)",
    "mod\\.rs:265:47: replace < with <= in Grid::drop_placements_off_screen",

    # -- grid/link_table.rs
    # `last` is only a cache, and one that is read only where its entry is in use.
    "link_table\\.rs:105:26: replace == with != in Links::release",
    # The fast path of `attach`: when the last run starts before the offset, the partition point is the
    # end anyway. And no run starts at the offset, for the cells there were given back first.
    "link_table\\.rs:120:27: replace match guard last.start >= offset with true in Links::attach",
    "link_table\\.rs:120:89: replace < with <= in Links::attach",
    # A run that starts where the cut ends adds a piece with no cells (released and attached by none),
    # and is put back as it was.
    "link_table\\.rs:180:75: replace < with <= in Links::cut",
    # A cache of the last link looked up: the lookup by value finds the same entry.
    "replace same_link -> bool with false",

    # -- grid/links.rs
    # `link_run(above, cols - 1)` only finds a run that holds the last column, so it ends there.
    "links\\.rs:42:35: replace match guard hi \\+ 1 == self.cols with true in Grid::link_span",
    # Runs of one link that are next to each other are one run (`attach` joins them), so no run ends
    # where another that holds the column begins; and in the wrap checks the guard stops it anyway.
    "links\\.rs:71:53: replace < with <= in Grid::link_run",

    # -- grid/page/edit.rs
    # Nothing is shifted when the kept part is empty: the second split is of a column already split,
    # and the move is of no cells.
    "edit\\.rs:112:21: replace > with >= in Page::insert_cells",
    "edit\\.rs:116:21: replace > with >= in Page::insert_cells",
    "edit\\.rs:163:67: replace \\| with \\^ in Page::move_cells",
    # A move of no distance walks either way to the same end.
    "edit\\.rs:167:32: replace > with >= in Page::move_cells",

    # -- grid/page/mod.rs
    # The flags that are set together are distinct bits: OR and XOR agree.
    "mod\\.rs:233:31: replace \\| with \\^ in Page::set_wrapped",
    "mod\\.rs:260:45: replace \\| with \\^ in Page::set_line_size",
    # A tail is never in column 0: it follows its head.
    "mod\\.rs:337:16: replace > with >= in Page::split_wide_at",
    # `split_wide_at` refuses the column past the row itself; and the halves of a wide character carry
    # the same protection, so asking the cell at the edge or the one before it is the same question.
    "mod\\.rs:374:31: replace < with <= in Page::guard_edges_sparing",
    "mod\\.rs:374:69: replace - with / in Page::guard_edges_sparing",

    # -- grid/page/rect.rs
    # A tail is never in column 0, and a wide character is never in the last column.
    "rect\\.rs:39:23: replace > with >= in Page::restyle",
    "rect\\.rs:42:45: replace < with <= in Page::restyle",

    # -- grid/page/write.rs
    # Pen flags never include the wide or tail flag (distinct bits), nor do the tail's flags.
    "replace \\| with \\^ in Page::write_char",
    # A spacer tail is never in column 0: it follows its head.
    "replace > with >= in Page::push_mark",
    # The cell at `col` is narrow and no tail, so cutting at `col` rather than `col + 1` cuts nothing.
    "write\\.rs:167:44: replace \\+ with \\* in Page::set_width",
    # The flags that make the tail are distinct bits: OR and XOR agree.
    "replace \\| with \\^ in Page::set_width",

    # -- grid/pages.rs
    # The walk back over four pages is a shortcut: staying on the same page four times and then
    # searching is the same answer.
    "pages\\.rs:39:18: replace -= with /= in Grid::locate",

    # -- grid/pen.rs: protected, guarded and the block's part are three places that do not overlap.
    "replace \\| with \\^ in Pen::cell_flags",

    # -- grid/rect.rs
    # `Page::restyle` returns for an empty range too, before touching anything.
    "rect\\.rs:18:37: replace < with <= in Grid::restyle",
    # Each row is read whole before it is written, so the order of the rows does not matter
    # when the rectangle moves sideways only.
    "replace > with >= in Grid::copy_rect",

    # -- grid/resize.rs
    # A pin or a picture never sits on the row after the last (`end`): both are cut at it.
    "resize\\.rs:72:65: replace < with <= in Grid::resize",
    "resize\\.rs:86:63: replace < with <= in Grid::resize",
    # Where the top row is above the first, the picture is not reflowed (the width is the same,
    # or it was dropped before), so carrying it along puts it back where it was.
    "resize\\.rs:86:56: replace && with \\|\\| in Grid::resize",
    # The rows up to the last text and the cursor already reach the cursor's row.
    "resize\\.rs:111:49: replace \\+ with \\* in Grid::resize",
    # Where the new end is the old one, nothing is dropped or cut either way (a loop of no rows).
    "resize\\.rs:117:20: replace > with >= in Grid::resize",
    # The cursor's column is inside the new width before this: every path that gives it one cuts it.
    "resize\\.rs:141:85: replace - with [/+] in Grid::resize",
    # With one page, the rows to drop are fewer than the page has (the screen keeps at least one), so
    # the page is never the whole of them.
    "resize\\.rs:147:41: replace > with >= in Grid::drop_tail_rows",

    # -- grid/rewrap.rs
    # A style is in the line's list and in its map both, so either finds it.
    "rewrap\\.rs:68:42: replace <= with > in LineBuf::style_index",
    # A cell on the end of the line, or past it, goes just after the text either way.
    "rewrap\\.rs:227:33: replace < with <= in Rewrap::row",
    # Copying no cells is a copy of an empty range, which `copy_from_page` returns from.
    "rewrap\\.rs:243:16: replace > with >= in Rewrap::copy_row",
    # A wide character is always followed by its second half in the line: the check that it is
    # there never fails.
    "rewrap\\.rs:294:52: replace \\+ with \\* in Rewrap::emit_line",
    "rewrap\\.rs:294:56: replace < with <= in Rewrap::emit_line",

    # -- grid/scroll.rs
    # A scroll over several pages that is not rotated is copied row by row, with the same result.
    "replace Grid::rotate_across_pages -> bool with false",
    "replace < with <= in Grid::rotate_across_pages",
    # Without rows under the region there is nothing to move down.
    "scroll\\.rs:284:18: replace > with >= in Grid::scroll_into_history",
    # The rows appended are blank already: erasing them with the default background changes nothing.
    "scroll\\.rs:290:18: replace > with >= in Grid::scroll_into_history",
    "replace bg_is_default -> bool with false",
    # Every caller passes rows inside the screen (the region is cut to it), and a one-row region has
    # its row dirtied by the blanking of the row that leaves.
    "scroll\\.rs:76:35: replace - with [/+] in Grid::mark_rows_dirty",
    "scroll\\.rs:77:15: replace > with (==|>=) in Grid::mark_rows_dirty",

    # -- grid/search.rs
    # A column number is under 2^31, so the wide bit is never one of its bits.
    "replace \\| with \\^ in Building::character",
    # An entry for the first trimmed byte is never looked up: a range ends inside the text.
    "replace < with <= in finish_line",

    # -- grid/style.rs: the tag of a kind of color, and the three bytes of a color, are put in places
    # that do not overlap, so OR and XOR make one number.
    "style\\.rs:(70:48|71:47|72:44|72:67|72:89): replace \\| with \\^ in Style::table_hash::bits",

    # -- grid/style_table.rs
    # `last` is a cache of the style the last lookup found: the index finds it as well, and the cache
    # is cleared when its entry is freed.
    "style_table\\.rs:212:17: replace != with == in StyleTable::acquire",
    "style_table\\.rs:214:27: replace != with == in StyleTable::acquire",
    "style_table\\.rs:349:22: replace == with != in StyleTable::remove",

    # -- grid/text.rs: `push_slice` cuts the last column to the row's width.
    "replace - with [/+] in Grid::each_span_row",
    "text\\.rs:211:27: replace - with [/+] in Grid::logical_lines",
    # A range wholly above the history or below the screen has no row to walk anyway: the loops that
    # follow are empty for it.
    "text\\.rs:141:35: replace \\|\\| with && in Grid::push_text_between",
    "text\\.rs:175:37: replace \\|\\| with && in Grid::push_text_between",

    # -- grid/words.rs
    # A line above the first is not wrapped, so stepping up to it from the first stays put; and a
    # step past the last line or the first ends the walk (no cell) as no step does.
    "replace > with >= in Grid::line_extent",
    "words\\.rs:61:27: replace > with >= in Grid::step_left",
    "words\\.rs:76:27: replace < with <= in Grid::step_right",
    "words\\.rs:110:35: replace < with <= in Grid::bracket_match",
    "words\\.rs:117:31: replace > with >= in Grid::bracket_match",

    # -- input/
    # The Alt and Meta bits are distinct: OR and XOR agree.
    "mouse\\.rs:142:52: replace \\| with \\^ in encode",
    # The legacy form has only the three buttons, wheels and no motion in it: the code stays under
    # 96, so `code + 32` never reaches 255.
    "mouse\\.rs:195:48: replace > with (==|>=) in encode",
    # A capacity hint (what `Vec::with_capacity` is, and the same rule). The first `+` made a
    # subtraction is not one: a text under six bytes then underflows, which a test sees.
    "paste\\.rs:26:28: replace \\+ with \\* in paste",
    "paste\\.rs:26:48: replace \\+ with [-*] in paste",

    # -- parser/
    # Bit 7 of a lane is set by at most one of the two terms (a byte under 0x20 and DEL are not both).
    "scan\\.rs:23:29: replace \\| with \\^ in not_printable",
    # The fast paths of `decode` are shortcuts for `exact`, which gives the same character: a mutant
    # that makes a shortcut fail only sends the bytes the slow way. The `|` joins bits that do not
    # overlap, and the `&` of the lead byte of four, mutated, makes a code point too big to be one.
    "utf8\\.rs:33:15: replace \\^ with \\| in decode",
    "utf8\\.rs:35:35: replace \\| with \\^ in decode",
    "utf8\\.rs:53:22: replace & with [\\^|] in decode",

    # -- terminal/base64.rs
    # Sextets joined to the left of six free bits, and bytes put in 8-bit places: no overlap.
    "base64\\.rs:57:30: replace \\| with \\^ in decode",
    "base64\\.rs:69:75: replace \\| with \\^ in encode",
    # A tail has two or three characters (one is refused before): `4 - n` and `4 / n` are 2 and 1.
    "base64\\.rs:59:25: replace - with / in decode",

    # -- terminal/dispatch/
    # The next APC string starts by clearing what a cancelled one left (`start_apc`, `begin_kitty`), and
    # a cancelled one is never finished.
    "replace <impl Handler for Sink<'_>>::apc_cancel with \\(\\)",
    # The suspended modes (autowrap, origin, insert, new line) are off while VT52 mode lasts, and
    # nothing in it turns them on: they are not in `self.modes` when they are in `suspended`.
    "replace \\| with \\^ in Terminal::modes_before_vt52",

    # -- terminal/graphics/
    # The groups of sextets are joined where their bits do not overlap.
    "apc\\.rs:111:(57|74|91): replace \\| with \\^ in ApcReader::payload",
    # Ids are unique (`check` says so) and sorted, so once one is past `next` all the others are: the
    # `break` is an early exit.
    "images\\.rs:85:26: replace > with (<|==|>=) in ImageTable::free_id",
    # The measuring walk's early exits for a picture too wide or too tall: the check after it says
    # the same (and a height is a multiple of six, which is never 10,000).
    "sixel\\.rs:210:43: replace \\|\\| with && in decode",
    "sixel\\.rs:210:58: replace > with (==|>=) in decode",
    # Three bytes of a size are three disjoint places.
    "sniff\\.rs:28:(26|49): replace \\| with \\^ in le24",

    # -- terminal/modes/mod.rs: LOCATOR is only ever added by `modes()` itself.
    "replace \\| with \\^ in Terminal::modes",

    # -- terminal/read/selection.rs: a block's columns are at most the screen's width, so its last
    # is at most the last column, and its first (before the last) is under it.
    "selection\\.rs:(205:63|206:70): replace - with [/+] in Terminal::covered",

    # -- terminal/reports/
    # `invoke` keeps the low two bits of a set's number, and '0' + n has the same ones as n.
    "replace - with \\+ in CursorInformation::read",
    # The bits of a cursor report's flags are distinct places.
    "presentation\\.rs:(63|66|67|68|69):[0-9]+: replace \\| with \\^ in Terminal::write_cursor_information",
    # Only the foreground and background are written with a name, and they are never the bright ones
    # beyond 15 or an underline's: the guard is true for every color that gets here.
    "replace match guard base != 0 && \\(named as u16\\) < 16 with true in write_color",

    # -- terminal/screen/reset.rs: neither starting mode is in the other set (the mode 40 permission is
    # not an initial mode; the three DECSTR sets are distinct).
    "replace \\| with \\^ in Terminal::reset",
    "replace \\| with \\^ in Terminal::soft_reset",

    # -- terminal/text/
    # What a push saves and what is cleared are distinct bits; the style's underline color is the
    # one `..style` already gives.
    "replace \\| with \\^ in Entry::restore",
    "sgr_stack\\.rs:195:37: delete field underline_color from struct Style expression in Terminal::report_sgr",
    # Bold and dim are two bits.
    "sgr\\.rs:75:49: replace \\| with \\^ in Style::apply",

    # ---- terminal/{graphics,reports,osc,text}: the second run's equivalent mutants.

    # -- terminal/graphics/
    # Four base64 characters at a time is a shortcut past the one-by-one reading, which reads the
    # same bytes and keeps the same cap: a mutant that makes the shortcut refuse every group (the
    # mask turned into an XOR or an OR can never be zero) only takes the slow way.
    "apc\\.rs:103:36: replace & with [\\^|] in ApcReader::payload",
    # The same disjoint sextets as the fast path's (a six-bit value shifted to the top of a byte and
    # the rest of a byte shifted down).
    "apc\\.rs:(136:(57|74|91)|154:42|156:46): replace \\| with \\^ in ApcReader::(payload|finish)",
    # At a width of exactly the terminal's, scaling the picture by `screen_w / w` is scaling by one.
    "iterm\\.rs:129:27: replace > with >= in FileArgs::geometry",
    # An id's red, green and blue bytes, and the high byte of a long id over the 24 bits of the
    # color, are in separate places.
    "placeholder\\.rs:(349:(51|75)|366:31): replace \\| with \\^ in (id_bits|placeholder_at)",
    # The cursor is put in the last column and `normalize_cursor` cuts any column to the row's
    # last right after, so a column past it (the `+` and the `/`) comes to the same one; and the
    # width the picture reaches is only tested for being at the edge, which `cols + x0` is as much.
    "put\\.rs:104:43: replace - with [/+] in Terminal::put_image",
    "put\\.rs:102:58: replace - with \\+ in Terminal::put_image",
    # Every painted run was measured by the first walk, so the width has room for it at `x`: the
    # `min` never cuts. And the work, a multiple of six, never is the budget, a power of two.
    "sixel\\.rs:240:40: replace - with \\+ in decode",
    "sixel\\.rs:242:22: replace > with >= in decode",

    # -- terminal/reports/
    # The four mouse tracking modes are four bits: OR and XOR of them agree.
    "locator\\.rs:219:(44|64|86): replace \\| with \\^ in Terminal::enable_locator",
    # A locator is switched on only at VT300 and above, and the level changes only with DECSCL, a hard
    # reset that switches it off again: below VT300 it is off, and the other half of the test says so.
    "locator\\.rs:259:23: replace < with == in Terminal::enable_filter_rectangle",
    # The attribute bits of a cursor report's rendition, and the 0x40 and the sizes' bits, are
    # distinct places (the flags and the protection's bits are in the entry for the lines above).
    "presentation\\.rs:(59|60|61|62):13: replace \\| with \\^ in Terminal::write_cursor_information",
    "presentation\\.rs:72:(18|104): replace \\| with \\^ in Terminal::write_cursor_information",
    # A color of an SGR string is named only for the foreground and the background (the first match
    # arm takes the defaults), whose guard has a base; an underline color is never a named one, and no
    # named color is 16.
    "rqss\\.rs:201:42: replace && with \\|\\| in write_color",
    "rqss\\.rs:201:60: replace < with <= in write_color",
    # A name of a terminfo capability is under nine characters; one that is longer is refused as
    # a name that is not one, in the length test or by the lookup, with the same answer.
    "tcap\\.rs:61:(52|56): replace (/ with \\*|> with >=) in decode_hex",
    # While the mode is on, the size last reported is the one the DECSET that turned it on made: what
    # a reset forgets is never read before that replaces it.
    "replace Terminal::forget_inband_size with \\(\\)",
    # DECSCPP keeps the rows, so the margins that were inside them still are: the `min` is no cut.
    "window\\.rs:(267:47|268:53): replace - with [/+] in Terminal::set_columns_per_page",

    # -- terminal/osc/
    # A text of exactly the limit is cut to itself.
    "payload\\.rs:5:19: replace > with >= in cut",
    # The cap of a pointer name is above every name there is (32 bytes; the longest is 18), and no
    # shape has an empty name: a name the check lets through is no shape, and `shape` says so.
    "pointer\\.rs:79:(24|38): replace (\\|\\| with &&|> with (==|>=)) in shape",
    # The digits of a component are shifted four places up, which leave no bit for the digit's own.
    "spec\\.rs:63:28: replace \\| with \\^ in hex",
]
