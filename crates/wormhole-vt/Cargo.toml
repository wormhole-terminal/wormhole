[package]
name = "wormhole-vt"
# The engine's own version, not the app's (`workspace.package.version`): `scripts/release.sh` bumps
# the app and leaves this alone; a release of the crate is its own tag and CHANGELOG.md.
version = "0.1.0"
edition.workspace = true
# The oldest compiler that builds the library: 1.88 stabilised `let` chains (2024 edition) and
# `slice::as_chunks`; 1.85 to 1.87 fail on exactly those. Found with `cargo +<version> check`.
rust-version = "1.88"
description = "A terminal engine: the escape-sequence parser, the screen and its history. No PTY, no UI."
# MIT, unlike the app (GPL-3.0-or-later), so other projects can embed the engine.
license = "MIT"
readme = "README.md"
repository.workspace = true
homepage = "https://getwormhole.app"
documentation = "https://docs.rs/wormhole-vt"
keywords = ["terminal", "vt100", "ansi", "escape-sequences", "emulator"]
categories = ["command-line-interface", "parser-implementations"]
# The one crate of the workspace that is published (the workspace default is `false`).
publish = true
# What a user of the package does not need: the fuzz crate is its own package, the conformance
# cases are run by the bench crate, which is not part of the package, and the API listing is a
# review aid of the repository.
exclude = ["/fuzz", "/tests/conformance", "/api.txt"]

[package.metadata.docs.rs]
# No `all-features`: the only feature is `internals`, which is not for users and stays out of the docs.
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitflags = "2"
# The parser's and the grid's byte searches (SIMD; already in the dependency graph).
memchr = "2.8"

[dev-dependencies]
# The crate's own tests, examples and benches look inside it (the grid, the invariants check, the
# repaint's coverage tables), which only the `internals` feature opens. Naming the crate here
# switches it on for them, so `cargo test -p wormhole-vt` needs no flag, and not for anyone who
# depends on the crate.
wormhole-vt = { path = ".", features = ["internals"] }
# Micro-benchmarks (`cargo bench -p wormhole-vt`): allocation counts and throughput per hot path.
divan = "0.1"

[features]
# Not for users, not stable, not versioned: what our own tools reach into. It makes the `grid`
# module public (hidden from the docs), and adds `Terminal::grid`, `Terminal::dump_state` (the
# whole state as named text, for the bisimulation tests of the repaint writer in
# `wormhole-vt-bench`), `Terminal::check_invariants` and the repaint's coverage tables.
internals = []

[[example]]
name = "grid_bench"
required-features = ["internals"]

[lints]
workspace = true

[[bench]]
name = "engine"
harness = false
