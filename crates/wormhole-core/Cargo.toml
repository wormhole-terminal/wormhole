[package]
name = "wormhole-core"
description = "Wormhole's UI-independent core: terminal engine, git, config, persistence, agent hooks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The value types the screen is read and driven in (the engine's boundary).
wormhole-vt.workspace = true
anyhow.workspace = true
dirs.workspace = true
libc.workspace = true
plist.workspace = true
# Find in scrollback: Unicode word boundaries, which a lazy DFA can't do (already in the dependency
# graph through other crates).
regex = "1.13"
# The PTY reader thread waits on the master, the child's exit and its inbox with it (kqueue on
# macOS).
polling = "3.8"
# kitty's notifications (OSC 99) may carry their text base64-encoded, and OSC 52 replies are.
base64 = "0.22"
# Inline images (kitty's graphics protocol, iTerm2's `1337;File`): PNG, JPEG and GIF decoded
# under memory limits (GPUI already depends on it with these features and more).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rusqlite.workspace = true
serde.workspace = true
# Config files we edit for agents (~/.claude/settings.json, …) keep their key
# order; without this it would depend on another crate enabling the feature.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
smol.workspace = true
toml.workspace = true
tracing.workspace = true
# Family names and monospace detection for bundled and user font files
# (the same font reader GPUI's text stack already ships; the unmaintained
# ttf-parser is no longer a direct dependency).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Self-updater: blocking HTTPS (no tokio) against the macOS trust store,
# minisign signatures, .tar.gz archives.
flate2 = "1.1"
minisign-verify = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1.0", features = ["serde"] }
tar = { version = "0.4.45", default-features = false }
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[features]
# `terminal::testing`: terminals without a PTY, for the app's render tests (its dev-dependencies
# turn this on, so the shipped build never has it).
test-support = []

[lints]
workspace = true

[dev-dependencies]
minisign = "0.9"
tiny_http = "0.12"
