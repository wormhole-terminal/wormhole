[package]
name = "wormhole-core"
description = "Wormhole's UI-independent core: terminal engine, git, config, persistence, agent hooks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The value types the screen is read and driven in (the engine's boundary).
wormhole-vt.workspace = true
# The terminal layer (a program in a PTY and the screen it draws), which core re-exports as `terminal`.
wormhole-term.workspace = true
# The session host's wire protocol, to end a host from the command line (`hosts::end_host`).
wormhole-wire.workspace = true
anyhow.workspace = true
# Agent reports carry RFC 3339 timestamps; compare source times across concurrent terminals.
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs.workspace = true
libc.workspace = true
plist.workspace = true
rusqlite.workspace = true
# The terminals' saved text is sealed with ChaCha20-Poly1305 (the ring rustls already brings), its
# key wiped from memory when dropped.
ring = "0.17"
zeroize = "1"
serde.workspace = true
# Config files we edit for agents (~/.claude/settings.json, …) keep their key
# order; without this it would depend on another crate enabling the feature.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
smol.workspace = true
toml.workspace = true
tracing.workspace = true
# Family names and monospace detection for bundled and user font files
# (the same font reader GPUI's text stack already ships; the unmaintained
# ttf-parser is no longer a direct dependency).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Self-updater: blocking HTTPS (no tokio) against the macOS trust store,
# minisign signatures, .tar.gz archives.
flate2 = "1.1"
minisign-verify = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1.0", features = ["serde"] }
tar = { version = "0.4.45", default-features = false }
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The saved text's key in the login Keychain (already in the tree through rustls' platform verifier).
security-framework = "3"
core-foundation = "0.10"

[features]
# The saved terminal text's key in a file beside it instead of the Keychain, as debug builds do:
# for development builds in the release profile (`wormhole/devctl` turns it on). Never shipped.
dev-key = []
# `terminal::testing`: terminals without a PTY, for the app's render tests (its dev-dependencies
# turn this on, so the shipped build never has it).
test-support = ["wormhole-term/test-support"]
# Counters of what reading output costs, for the app's devctl `perf-profile`.
perf-counters = ["wormhole-term/perf-counters"]

[lints]
workspace = true

[dev-dependencies]
minisign = "0.9"
tiny_http = "0.12"
