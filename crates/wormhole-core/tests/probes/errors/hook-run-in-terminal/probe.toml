[probe]
id = "fixture"
name = "Fixture"
description = "A fixture for one validate finding."
author = "tests"
version = "0.1.0"
wormhole = ">=1.3"
api = 1
[permissions]
process = ["say"]
[[contributes.commands]]
id = "c"
title = "C"
run = ["say", "done"]
in = "new-terminal"
[[contributes.hooks]]
id = "h"
on = "bell"
do = [{ type = "run", command = "c" }]
