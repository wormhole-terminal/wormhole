[probe]
id = "rules-only"
name = "Fixture"
description = "A fixture for one validate finding."
author = "tests"
version = "0.1.0"
wormhole = ">=1.3"
api = 1
[[contributes.rules]]
id = "r"
pattern = '(?-u:\b)([A-Z]{2,5}-[0-9]{1,6})(?-u:\b)'
tone = "link"
hover = "Ticket {1}"
[[contributes.rules]]
id = "key"
pattern = 'sk-[A-Za-z0-9_-]{20,}'
look = "redact"
reveal = "deliberate"
