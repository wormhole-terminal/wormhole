[package]
name = "wormhole-ffi"
description = "The Swift UI experiment's seam: a terminal of the real engine behind UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `staticlib` goes into the xcframework; `lib` lets the tests link it.
crate-type = ["staticlib", "lib"]

[dependencies]
# `dev-key`: Probe approvals and the other sealed stores keep their keys in files of the experiment's own data
# folder, never in the login Keychain (the experiment never touches it); drop it when the Swift app ships.
# `dev-key`: the saved text's key lives in a file beside it, never in the login Keychain: this crate only runs in
# `Wormhole-swift*` data folders (`isolation`), and an experiment must not leave items in anyone's Keychain.
wormhole-core = { path = "../wormhole-core", features = ["dev-key"] }
wormhole-term = { path = "../wormhole-term" }
wormhole-text = { path = "../wormhole-text" }
anyhow = "1"
tracing = "0.1"
semver = "1"
uniffi = "0.32"
thiserror = "2"
# Blocks the event thread on `PtyEvents::recv`, which is async (already in the tree through core).
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
flate2 = "1.1"
minisign = "0.9"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tiny_http = "0.12"
wormhole-term = { path = "../wormhole-term", features = ["test-support"] }

# A workspace of its own (this crate and its bindings generator), so that nothing here reaches the app's
# `Cargo.lock`, `cargo deny`, `licenses.json` or `scripts/structure.py` yet: the root `Cargo.toml` lists this
# folder under `exclude`. The app's crates come in by path; none of them may name anything in here.
[workspace]
members = ["bindgen"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/wormhole-terminal/wormhole"
publish = false

# The root workspace's lints, repeated: a package inherits the lints of its own root.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
wildcard_imports = "warn"
self_named_module_files = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
