[package]
name = "wormhole-ffi"
description = "The Swift UI experiment's seam: a terminal of the real engine behind UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `staticlib` goes into the xcframework; `lib` lets the tests link it.
crate-type = ["staticlib", "lib"]

[dependencies]
# Its `dev-key` feature is this crate's own (below), so a shipped build can leave it out.
wormhole-core = { path = "../wormhole-core" }
wormhole-term = { path = "../wormhole-term" }
wormhole-text = { path = "../wormhole-text" }
anyhow = "1"
tracing = "0.1"
# The log files and the panic record (`src/logging.rs`), as the app has them.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
semver = "1"
uniffi = "0.32"
thiserror = "2"
# Blocks the event thread on `PtyEvents::recv`, which is async (already in the tree through core).
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Syntax colours for the diff and the Files viewer (`src/syntax`): the parser and the app's grammars, each at the
# version the app's `Cargo.lock` has through GPUI Kit, so the two apps read a file with the same grammar (the two
# pinned ones have a newer patch release the app's lock does not have yet: follow the app's lock).
tree-sitter = "0.26"
tree-sitter-bash = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.23"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "=0.5.3"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "=0.7.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[features]
# On by default, which is every dev and test build: Probe approvals, the saved text's key and the other sealed stores
# keep their keys in files of the data folder, never in the login Keychain, so an experiment leaves nothing in anyone's
# Keychain. The shipped build is made with `--no-default-features`: its keys are in the Keychain, as 1.x's are.
# `isolation` ties the two together: a library that keeps keys in files only opens `Wormhole-swift*` folders.
default = ["dev-key"]
dev-key = ["wormhole-core/dev-key"]
# `perf-counters`: the terminal layer's reader and lock counters, for the Swift app's `perf-profile` (a build
# made to measure turns it on; the shipped library never has it, and `perf-profile` then says the reader was not counted).
perf-counters = ["wormhole-term/perf-counters"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# The licenses test reads `Cargo.lock` (already in the tree through core).
toml = "1"
flate2 = "1.1"
minisign = "0.9"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tiny_http = "0.12"
wormhole-term = { path = "../wormhole-term", features = ["test-support"] }
# `with_front_end`: the rows only the Swift app shows are tested as the Swift app.
wormhole-core = { path = "../wormhole-core", features = ["test-support"] }

# A workspace of its own (this crate and its bindings generator), so that nothing here reaches the app's
# `Cargo.lock` or `scripts/structure.py` yet: the root `Cargo.toml` lists this folder under `exclude`. What the
# root's tools do not see has its own: `cargo deny` over this `Cargo.lock` (`scripts/check.sh`) and
# `assets/licenses.json` (`scripts/gen-licenses.py --ffi`). The app's crates come in by path; none of them may
# name anything in here.
[workspace]
members = ["bindgen"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/wormhole-terminal/wormhole"
publish = false

# The root workspace's lints, repeated: a package inherits the lints of its own root.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
wildcard_imports = "warn"
self_named_module_files = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
