[package]
name = "wormhole-vt-bench"
description = "Tools for Wormhole's terminal engine: the engine adapter, the conformance runner, the corpus, differential tests and vtbench."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[[bin]]
name = "vtbench"
path = "src/bin/vtbench/main.rs"

[[bin]]
name = "ucs-host"
path = "src/bin/ucs_host.rs"

[[bin]]
name = "fuzz-seeds"
path = "src/bin/fuzz_seeds.rs"

[[bin]]
name = "esctest-host"
path = "src/bin/esctest_host/main.rs"

[dependencies]
# The engine under test: Wormhole's own (an adapter in `engines/`).
wormhole-vt.workspace = true
# `Attrs`, the cell attributes an adapter reports (already in the dependency graph).
bitflags = "2"
# vtbench's --json output (already in the dependency graph).
serde_json.workspace = true

[lints]
workspace = true
